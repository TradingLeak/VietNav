name: Build iOS IPA (VietNav)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Show environment and install XcodeGen
        run: |
          xcodebuild -version
          swift --version
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Download offline map data
        run: |
          set -euo pipefail
          mkdir -p VietNav/Resources/speedmap
          BASE="https://raw.githubusercontent.com/911273/VietHUD/main/speedmap"
          for f in cameras.bin signs.bin tiles.bin index.bin metadata.bin names.bin seg_names.bin; do
            echo "Downloading $f ..."
            curl --fail --location --retry 3 --retry-all-errors --output "VietNav/Resources/speedmap/$f" "$BASE/$f"
            test -s "VietNav/Resources/speedmap/$f"
          done
          ls -lh VietNav/Resources/speedmap

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Import signing certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$CERTIFICATE_BASE64" || { echo "Missing repository secret CERTIFICATE_BASE64"; exit 1; }
          test -n "$CERTIFICATE_PASSWORD" || { echo "Missing repository secret CERTIFICATE_PASSWORD"; exit 1; }
          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > /tmp/vietnav-certificate.p12
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import /tmp/vietnav-certificate.p12 -k build.keychain -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" build.keychain

      - name: Install provisioning profile
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$PROVISIONING_PROFILE_BASE64" || { echo "Missing repository secret PROVISIONING_PROFILE_BASE64"; exit 1; }
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          printf '%s' "$PROVISIONING_PROFILE_BASE64" | base64 --decode > /tmp/vietnav-profile.mobileprovision
          security cms -D -i /tmp/vietnav-profile.mobileprovision > /tmp/vietnav-profile.plist
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' /tmp/vietnav-profile.plist)
          cp /tmp/vietnav-profile.mobileprovision "$PROFILE_DIR/$PROFILE_UUID.mobileprovision"

      - name: Build archive
        env:
          PROFILE_NAME: ${{ secrets.PROFILE_NAME }}
        run: |
          set -euo pipefail
          test -n "$PROFILE_NAME" || { echo "Missing repository secret PROFILE_NAME (the profile's display name)"; exit 1; }
          TEAM_ID=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' /tmp/vietnav-profile.plist)
          xcodebuild \
            -project VietNav.xcodeproj \
            -scheme VietNav \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/VietNav.xcarchive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            archive

      - name: Export IPA
        env:
          PROFILE_NAME: ${{ secrets.PROFILE_NAME }}
        run: |
          set -euo pipefail
          cat > exportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>ad-hoc</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' /tmp/vietnav-profile.plist)</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.vietnav.app</key>
              <string>${PROFILE_NAME}</string>
            </dict>
            <key>stripSwiftSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF
          plutil -lint exportOptions.plist
          xcodebuild -exportArchive \
            -archivePath build/VietNav.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist exportOptions.plist

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: VietNav-ipa
          path: build/ipa/*.ipa
          if-no-files-found: error
          retention-days: 30
