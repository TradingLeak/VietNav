name: Build iOS IPA (VietNav)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install Xcode (if needed)
        run: |
          if [ ! -d /Applications/Xcode.app ]; then
            xcode-select -p
          fi

      - name: Show environment
        run: |
          xcodebuild -version
          swift --version

      - name: Download offline map data (speedmap)
        run: |
          mkdir -p VietNav/VietNav/Resources/speedmap
          BASE="https://raw.githubusercontent.com/911273/VietHUD/main/speedmap"
          for f in cameras.bin signs.bin tiles.bin index.bin metadata.bin names.bin seg_names.bin; do
            echo "Downloading $f ..."
            curl -L -o "VietNav/VietNav/Resources/speedmap/$f" "$BASE/$f"
          done
          ls -lh VietNav/VietNav/Resources/speedmap

      - name: Decode signing certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
        run: |
          echo "$CERTIFICATE_BASE64" | base64 --decode > /tmp/certificate.p12
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import /tmp/certificate.p12 -k build.keychain -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" build.keychain

      - name: Install provisioning profile
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision

      - name: Build Xcode project (create if missing)
        run: |
          # Nếu bạn chưa có .xcodeproj, tạo bằng xcodebuild template:
          if [ ! -f VietNav.xcodeproj/project.pbxproj ]; then
            echo "⚠️ Không tìm thấy .xcodeproj. Tạo mới bằng Xcode CLI..."
            xcodebuild -create-xcode-project -project VietNav -target VietNav
          fi
          echo "✅ Project ready"

      - name: Build archive
        run: |
          xcodebuild \
            -project VietNav.xcodeproj \
            -scheme VietNav \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/VietNav.xcarchive \
            archive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="iPhone Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME"

      - name: Export IPA
        run: |
          cat > exportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>ad-hoc</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>compileBitcode</key>
            <false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath build/VietNav.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist exportOptions.plist

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: VietNav-ipa
          path: build/ipa/*.ipa
          retention-days: 30
