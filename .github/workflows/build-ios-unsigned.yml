name: Build Unsigned iOS IPA (No Apple Account)

on:
  push:
    branches: [main, 'arena/**']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Download offline map data
        run: |
          set -euo pipefail
          mkdir -p VietNav/Resources/speedmap
          BASE="https://raw.githubusercontent.com/911273/VietHUD/main/speedmap"
          for f in cameras.bin signs.bin tiles.bin index.bin metadata.bin names.bin seg_names.bin; do
            echo "Downloading $f ..."
            curl --fail --location --retry 3 --retry-all-errors --output "VietNav/Resources/speedmap/$f" "$BASE/$f"
            test -s "VietNav/Resources/speedmap/$f"
          done
          ls -lh VietNav/Resources/speedmap

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Build unsigned .app
        run: |
          set -euo pipefail
          set +e
          xcodebuild \
            -project VietNav.xcodeproj \
            -scheme VietNav \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build-xcodebuild.log
          xcode_status=${PIPESTATUS[0]}
          set -e
          if [ "$xcode_status" -ne 0 ]; then
            while IFS= read -r line; do
              safe_line=$(printf '%s' "$line" | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')
              echo "::error title=xcodebuild::$safe_line"
            done < <(grep -E 'error:|fatal error:|BUILD FAILED' build-xcodebuild.log | tail -n 50)
            exit "$xcode_status"
          fi

      - name: Package unsigned .ipa
        run: |
          set -euo pipefail
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/VietNav.app"
          test -d "$APP_PATH"
          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/
          (cd build/ipa && zip -qry VietNav-unsigned.ipa Payload)
          ls -lh build/ipa/VietNav-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: VietNav-unsigned-ipa
          path: build/ipa/VietNav-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
